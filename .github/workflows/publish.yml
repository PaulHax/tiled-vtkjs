name: CI

# Test on every push/PR. On merge to main, semantic-release analyzes the
# Conventional Commits since the last release, derives the next version, tags
# it, publishes to npm, and creates a GitHub Release when the repository
# variable NPM_PUBLISH_ENABLED is true. Merges with no
# releasable commits (only chore/docs/etc.) publish nothing.
#
# Auth is npm TRUSTED PUBLISHING (OIDC): no NPM_TOKEN secret — npm trusts this
# workflow's GitHub identity via the id-token permission (needs
# @semantic-release/npm >= 13.1.0 and npm >= 11.5.1), and provenance is
# automatic. GITHUB_TOKEN is provided by Actions. Configure the trusted
# publisher on the npm package (repo: PaulHax/tiled-vtkjs, workflow:
# publish.yml) before the first CI release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      terrane_producer_ref:
        description: Immutable TeleSculptor Web commit to compare against the checked fixture
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm rebuild
      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run commitlint -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # Also guard commits pushed directly to the repository.
      - name: Lint pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run commitlint -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - uses: actions/setup-python@v5
        if: inputs.terrane_producer_ref != ''
        with:
          python-version: "3.10"
      - name: Generate the fixture from the current terrain producer
        if: inputs.terrane_producer_ref != ''
        env:
          TERRANE_PRODUCER_REF: ${{ inputs.terrane_producer_ref }}
        run: |
          if [[ ! "$TERRANE_PRODUCER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::terrane_producer_ref must be a full commit SHA"
            exit 1
          fi
          git init "$RUNNER_TEMP/telesculptor-web"
          git -C "$RUNNER_TEMP/telesculptor-web" remote add origin \
            https://kwgitlab.kitware.com/computer-vision/telesculptor-web.git
          git -C "$RUNNER_TEMP/telesculptor-web" fetch --depth 1 origin "$TERRANE_PRODUCER_REF"
          git -C "$RUNNER_TEMP/telesculptor-web" checkout --detach FETCH_HEAD
          resolved_ref=$(git -C "$RUNNER_TEMP/telesculptor-web" rev-parse HEAD)
          test "$resolved_ref" = "$TERRANE_PRODUCER_REF"
          echo "Comparing fixture against producer $resolved_ref"
          python -m pip install --only-binary=:all: \
            numpy==1.26.4 pillow==12.1.1 pyproj==3.7.1
          PYTHONPATH="$RUNNER_TEMP/telesculptor-web/app" \
            python "$RUNNER_TEMP/telesculptor-web/tests/tools/generate_terrane_fixture.py" \
            "$RUNNER_TEMP/terrane-fixture"
          node test/fixtures/compareTerraneFixture.mjs "$RUNNER_TEMP/terrane-fixture"
      - name: Install Chromium for independent 3D Tiles conformance
        run: npx playwright install --with-deps chromium
      - name: Prove implicit refinement and quadrant identity in CesiumJS
        run: npx vitest run --config vitest.browser.config.ts test/browser/cesiumImplicit.spec.ts

  # Qualify the adapters and packed consumer against the exact required fork.
  # Native VTK declarations are installed before the package's prepare script.
  example-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm rebuild
      - uses: ./.github/actions/setup-vtk
      - run: npm run prepare
      - run: npm run typecheck
      - run: npm run verify:boundaries
      - run: npm run example:build
      - run: npm run verify:chain
      - name: Install Chromium for packed-package rendering
        run: npx playwright install --with-deps chromium
      - name: Verify packed imports, workers and real VTK rendering
        run: npm run verify:package
      - name: Verify memory policy, texture realization and decoder codecs in Chromium
        run: npx vitest run --config vitest.browser.config.ts test/browser/memoryPolicy.spec.ts test/browser/meshAlpha.spec.ts test/browser/tiles3dDecodeWorker.spec.ts test/browser/gaussianWorkers.spec.ts test/browser/gaussianTiles.spec.ts test/browser/gaussianAdapter.spec.ts test/browser/explorerLifecycle.spec.ts

  release:
    needs: [test, example-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create git tags + GitHub Releases
      issues: write # semantic-release/github comments on released issues
      pull-requests: write # ...and PRs
      id-token: write # OIDC identity for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm rebuild
      - uses: ./.github/actions/setup-vtk
      - run: npm run prepare
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
