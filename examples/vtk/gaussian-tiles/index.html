<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaussian 3D Tiles | tiled-vtkjs</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="viewer" aria-label="Gaussian 3D Tiles view"></main>
    <aside>
      <a class="brand" href="../">tiled-vtkjs</a>
      <h1>Gaussian 3D Tiles</h1>
      <p class="intro">Explore a splat scene as tiles stream into view.</p>
      <form id="dataset-form">
        <label for="dataset">Dataset</label>
        <select id="dataset">
          <option value="custom">Custom tileset</option>
        </select>
        <label for="tileset-url">Tileset URL</label>
        <input
          id="tileset-url"
          type="url"
          required
          placeholder="https://example.org/tileset.json"
        />
        <div class="actions">
          <button type="submit">Load tileset</button
          ><button type="button" id="reset-view">Frame scene</button>
        </div>
      </form>
      <label class="quality" for="quality"
        >Detail <output id="quality-value">16 px</output></label
      >
      <input id="quality" type="range" min="2" max="96" step="2" value="16" />
      <label class="visible"
        ><input id="visible" type="checkbox" checked /> Show scene</label
      >
      <p id="status" role="status">Choose a tileset to begin.</p>
      <p id="error" role="alert" hidden></p>
      <dl id="stats"></dl>
      <p id="location"></p>
      <p id="attribution"></p>
      <p class="help">Drag to pan · right-drag to orbit · scroll to zoom</p>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
